<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fire Incident Report Generator</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f2f4f7; color: #1e2430; min-height: 100vh; font-size: 15px; }

    header {
      background: linear-gradient(135deg, #7b1010, #c0392b, #e67e22);
      padding: 16px 20px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.2);
    }
    header .icon { font-size: 1.8rem; }
    header h1 { font-size: 1.05rem; font-weight: 800; color: #fff; letter-spacing: .04em; }
    header p  { font-size: .72rem; color: rgba(255,255,255,.8); margin-top: 2px; }

    .wrapper { max-width: 820px; margin: 0 auto; padding: 20px 14px 50px; }

    .section-label {
      display: flex; align-items: center; gap: 9px; margin: 18px 0 8px;
    }
    .section-label .tag {
      background: #c0392b; color: #fff; font-size: .65rem; font-weight: 900;
      letter-spacing: .1em; padding: 3px 9px; border-radius: 4px;
    }
    .section-label .label-text { font-size: .75rem; color: #7a8599; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .section-label .line { flex: 1; height: 1px; background: #d5dae5; }

    .card { background: #fff; border: 1px solid #dde2ec; border-radius: 10px; padding: 18px 20px; margin-bottom: 6px; }

    .field { margin-bottom: 13px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: .7rem; font-weight: 700; color: #8493ae; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
    .field label .ja { font-size: .8rem; color: #1e2430; font-weight: 600; text-transform: none; letter-spacing: 0; margin-left: 5px; }

    input[type="text"], input[type="date"], input[type="time"], select, textarea {
      width: 100%; background: #f7f9fc; border: 1.5px solid #d0d7e6;
      border-radius: 7px; padding: 9px 12px; color: #1e2430;
      font-size: .88rem; font-family: inherit; outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #c0392b; box-shadow: 0 0 0 3px rgba(192,57,43,.12); background: #fff;
    }
    textarea { resize: vertical; min-height: 68px; line-height: 1.6; }
    ::placeholder { color: #aab4c8; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    @media(max-width:480px){ .row2 { grid-template-columns: 1fr; } }

    .steps { display: flex; flex-direction: column; gap: 10px; }
    .step { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; }
    .step-num {
      width: 32px; height: 32px; background: #c0392b; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .7rem; font-weight: 900; color: #fff; margin-top: 26px; flex-shrink: 0;
    }

    .btn-add-action {
      background: none; border: 1.5px dashed #c0d0e0; color: #8493ae;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: .78rem;
      margin-top: 5px; transition: border-color .15s, color .15s;
    }
    .btn-add-action:hover { border-color: #c0392b; color: #c0392b; }
    .action-row { display: flex; gap: 8px; margin-bottom: 7px; }
    .action-row select { flex: 1; }
    .btn-rm { background: #fce8e6; border: none; color: #c0392b; border-radius: 6px; padding: 0 10px; cursor: pointer; font-size: 1rem; }

    .free-tag { background: #2980b9; }

    #generateBtn {
      width: 100%; padding: 15px; margin-top: 20px;
      background: linear-gradient(135deg, #922b21, #c0392b);
      color: #fff; border: none; border-radius: 10px;
      font-size: .95rem; font-weight: 800; letter-spacing: .05em;
      cursor: pointer; box-shadow: 0 4px 16px rgba(192,57,43,.3);
      transition: transform .15s, box-shadow .15s; text-transform: uppercase;
    }
    #generateBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(192,57,43,.42); }
    #generateBtn:active { transform: none; }

    #reportSection { display: none; margin-top: 24px; }
    #reportSection.visible { display: block; }
    .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .report-title { font-size: .75rem; font-weight: 800; color: #c0392b; text-transform: uppercase; letter-spacing: .08em; }
    .toolbar-btns { display: flex; gap: 8px; }
    .btn-copy, .btn-clear {
      padding: 7px 15px; border-radius: 6px; font-size: .78rem; font-weight: 700; cursor: pointer; border: none;
    }
    .btn-copy { background: #27ae60; color: #fff; }
    .btn-copy:hover { background: #1e9149; }
    .btn-copy.copied { background: #145a32; }
    .btn-clear { background: #e8ecf3; color: #7a8599; }
    .btn-clear:hover { background: #d0d7e6; }

    #reportBox {
      background: #111827; border: 1px solid #1e293b; border-radius: 10px;
      padding: 20px 24px; font-family: 'Courier New', monospace;
      font-size: .85rem; line-height: 1.9; white-space: pre-wrap;
      word-break: break-word; color: #c9d8f0;
    }

    .req { color: #c0392b; }
    footer { text-align: center; font-size: .68rem; color: #aab4c8; padding: 20px; }
  </style>
</head>
<body>

<header>
  <div class="icon">🚒</div>
  <div>
    <h1>FIRE INCIDENT REPORT GENERATOR</h1>
    <p>日本語で入力 → 英文 5W インシデントレポートを自動生成</p>
  </div>
</header>

<div class="wrapper">

  <!-- WHO -->
  <div class="section-label">
    <span class="tag">WHO</span>
    <span class="label-text">対応部隊</span>
    <span class="line"></span>
  </div>
  <div class="card">
    <div class="field">
      <label>出動部隊 <span class="ja">Responding Units</span> <span class="req">*</span></label>
      <input type="text" id="units" placeholder="例: E-11, L-1"/>
    </div>
    <div class="field">
      <label>指令センター <span class="ja">Dispatched by</span></label>
      <input type="text" id="dispatcher" placeholder="例: Butler Fire"/>
    </div>
  </div>

  <!-- WHAT -->
  <div class="section-label">
    <span class="tag">WHAT</span>
    <span class="label-text">インシデント種別</span>
    <span class="line"></span>
  </div>
  <div class="card">
    <div class="row2">
      <div class="field">
        <label>種別 <span class="ja">Incident Type</span> <span class="req">*</span></label>
        <select id="incidentType">
          <option value="">選択...</option>
          <optgroup label="火災">
            <option value="STRUCTURE FIRE">建物火災</option>
            <option value="VEHICLE FIRE">車両火災</option>
            <option value="WILDLAND FIRE">山林火災</option>
            <option value="ELECTRICAL FIRE">電気火災</option>
          </optgroup>
          <optgroup label="警報・調査">
            <option value="FIRE ALARM">火災報知器 / Fire Alarm</option>
            <option value="SMOKE INVESTIGATION">煙調査</option>
            <option value="CARBON MONOXIDE ALARM">CO警報</option>
            <option value="FALSE ALARM">誤報</option>
          </optgroup>
          <optgroup label="救急・その他">
            <option value="MEDICAL EMERGENCY">医療緊急</option>
            <option value="HAZMAT INCIDENT">危険物</option>
            <option value="GAS LEAK">ガス漏れ</option>
            <option value="VEHICLE ACCIDENT">交通事故</option>
            <option value="MUTUAL AID">相互援助</option>
          </optgroup>
        </select>
      </div>
      <div class="field">
        <label>カスタム <span class="ja">Custom Type（任意）</span></label>
        <input type="text" id="incidentTypeCustom" placeholder="上記以外の場合"/>
      </div>
    </div>
    <div class="field">
      <label>建物・施設 <span class="ja">Building / Facility</span></label>
      <input type="text" id="building" placeholder="例: BLDG#320"/>
    </div>
  </div>

  <!-- WHEN -->
  <div class="section-label">
    <span class="tag">WHEN</span>
    <span class="label-text">日時</span>
    <span class="line"></span>
  </div>
  <div class="card">
    <div class="row2">
      <div class="field">
        <label>時刻 <span class="ja">Time</span></label>
        <input type="time" id="incTime"/>
      </div>
      <div class="field">
        <label>タイムゾーン <span class="ja">Timezone</span></label>
        <select id="timezone">
          <option value="JST">JST</option>
          <option value="LOCAL">LOCAL</option>
          <option value="ZULU">ZULU</option>
          <option value="EST">EST</option>
          <option value="PST">PST</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>日付 <span class="ja">Date</span></label>
      <input type="date" id="incDate"/>
    </div>
  </div>

  <!-- WHERE -->
  <div class="section-label">
    <span class="tag">WHERE</span>
    <span class="label-text">場所</span>
    <span class="line"></span>
  </div>
  <div class="card">
    <div class="field">
      <label>基地・施設名 <span class="ja">Installation / Base</span></label>
      <input type="text" id="base" placeholder="例: CAMP FOSTER"/>
    </div>
    <div class="field">
      <label>詳細場所 <span class="ja">Specific Location</span></label>
      <input type="text" id="locationDetail" placeholder="例: Room#302, 2nd Floor"/>
    </div>
  </div>

  <!-- WHY -->
  <div class="section-label">
    <span class="tag">WHY</span>
    <span class="label-text">経緯・ナラティブ</span>
    <span class="line"></span>
  </div>
  <div class="card">
    <div class="steps">

      <div class="step">
        <div class="step-num">1</div>
        <div class="step-body">
          <div class="field">
            <label>到着時の状況 <span class="ja">Arrival / Scene Conditions</span></label>
            <select id="arrivalCondition">
              <option value="">選択...</option>
              <option value="nothing showing outside on 360">外観異常なし（360度確認）</option>
              <option value="smoke showing from the structure">建物から煙が見える</option>
              <option value="flames showing from the structure">建物から炎が見える</option>
              <option value="heavy smoke conditions throughout the building">建物全体に濃煙</option>
              <option value="fire fully involved">全焼状態</option>
              <option value="scene clear upon arrival">到着時異常なし</option>
              <option value="vehicle fully involved in flames">車両が全焼</option>
              <option value="patients on scene requiring medical attention">要救護者あり</option>
            </select>
          </div>
          <div class="field">
            <label>補足 <span class="ja">Additional notes（任意）</span></label>
            <input type="text" id="arrivalExtra" placeholder="例: bystanders reported smoke on 3rd floor"/>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-num">2</div>
        <div class="step-body">
          <div class="field">
            <label>調査結果 <span class="ja">Investigation Finding</span></label>
            <select id="finding">
              <option value="">選択...</option>
              <option value="smoke detector activation">煙感知器の作動</option>
              <option value="heat detector activation">熱感知器の作動</option>
              <option value="sprinkler activation">スプリンクラーの作動</option>
              <option value="burnt food/cooking odor, no fire">焦げ臭・調理臭（火災なし）</option>
              <option value="extinguished fire prior to arrival">到着前に鎮火済み</option>
              <option value="active fire on the floor">現場に活火</option>
              <option value="no evidence of fire or smoke">煙・火災の痕跡なし</option>
              <option value="gas leak detected">ガス漏れ検知</option>
              <option value="CO levels elevated">CO濃度上昇</option>
              <option value="faulty alarm/system malfunction">警報機の誤作動・故障</option>
            </select>
          </div>
          <div class="field">
            <label>場所・詳細 <span class="ja">Location / Detail</span></label>
            <input type="text" id="findingDetail" placeholder="例: room#302, kitchen area"/>
          </div>
          <div class="field">
            <label>原因 <span class="ja">Cause</span></label>
            <select id="cause">
              <option value="cause unknown">原因不明</option>
              <option value="under investigation">調査中</option>
              <option value="accidental">偶発的（事故）</option>
              <option value="unattended cooking">調理放置</option>
              <option value="electrical malfunction">電気系統の故障</option>
              <option value="suspected arson">放火疑い</option>
              <option value="equipment malfunction">設備故障</option>
              <option value="candle/open flame">ろうそく・裸火</option>
              <option value="no fire present — system fault">火災なし・システム誤作動</option>
            </select>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-num">3</div>
        <div class="step-body">
          <div class="field">
            <label>実施した措置 <span class="ja">Actions Taken</span> <span class="req">*</span></label>
            <div id="actionsContainer">
              <div class="action-row">
                <select class="action-select">
                  <option value="">選択...</option>
                  <option value="System reset completed">システムリセット完了</option>
                  <option value="Fire suppressed using 1¾-inch hose line">1¾インチホースで鎮火</option>
                  <option value="Ventilation conducted">換気実施</option>
                  <option value="Building evacuated">建物避難完了</option>
                  <option value="Utilities isolated (gas/electric)">ガス・電気遮断</option>
                  <option value="CO levels cleared">CO濃度正常確認</option>
                  <option value="Area ventilated and monitored">エリア換気・監視</option>
                  <option value="Overhaul conducted">オーバーホール実施</option>
                  <option value="Patient treated and transported">傷病者処置・搬送</option>
                  <option value="No action required">措置不要</option>
                  <option value="Turned over to civilian authorities">民間当局へ引き渡し</option>
                </select>
              </div>
            </div>
            <button type="button" class="btn-add-action" onclick="addAction()">＋ 措置を追加</button>
          </div>
          <div class="field">
            <label>補足・備考 <span class="ja">Additional Notes</span></label>
            <textarea id="actionsExtra" rows="2" placeholder="例: No injuries reported. Facility manager notified."></textarea>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-num">4</div>
        <div class="step-body">
          <div class="field">
            <label>結末 <span class="ja">Outcome / Resolution</span></label>
            <select id="outcome">
              <option value="returned to station">部隊帰還</option>
              <option value="remained on scene for overhaul">オーバーホールのため現場残留</option>
              <option value="turned over to civilian fire department">民間消防へ引き渡し</option>
              <option value="patient transported to naval hospital">傷病者を海軍病院へ搬送</option>
              <option value="scene secured and handed over to MP">MPへ引き渡し</option>
            </select>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- FREE -->
  <div class="section-label" style="margin-top:18px;">
    <span class="tag free-tag">FREE</span>
    <span class="label-text">フリーナラティブ（任意上書き）</span>
    <span class="line"></span>
  </div>
  <div class="card">
    <div class="field">
      <label>WHYを自由記述で上書き <span class="ja">Override narrative</span></label>
      <textarea id="freeNarrative" rows="4" placeholder="ここに英語で直接入力するとWHY部分をそのまま使用します（空欄の場合は上のステップから自動生成）"></textarea>
    </div>
  </div>

  <button id="generateBtn" onclick="generateReport()">🔥 GENERATE INCIDENT REPORT</button>

  <!-- Output -->
  <div id="reportSection">
    <div class="report-header">
      <span class="report-title">⚡ Generated Report</span>
      <div class="toolbar-btns">
        <button class="btn-copy" id="copyBtn" onclick="copyReport()">📋 Copy</button>
        <button class="btn-clear" onclick="clearReport()">✕ Clear</button>
      </div>
    </div>
    <div id="reportBox"></div>
  </div>

</div>

<footer>Fire Incident Report Generator — For training / drill use only</footer>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const now = new Date();
    document.getElementById('incDate').valueAsDate = now;
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('incTime').value = `${h}:${m}`;
  });

  function actionOptions() {
    return `<option value="">選択...</option>
      <option value="System reset completed">システムリセット完了</option>
      <option value="Fire suppressed using 1¾-inch hose line">1¾インチホースで鎮火</option>
      <option value="Ventilation conducted">換気実施</option>
      <option value="Building evacuated">建物避難完了</option>
      <option value="Utilities isolated (gas/electric)">ガス・電気遮断</option>
      <option value="CO levels cleared">CO濃度正常確認</option>
      <option value="Area ventilated and monitored">エリア換気・監視</option>
      <option value="Overhaul conducted">オーバーホール実施</option>
      <option value="Patient treated and transported">傷病者処置・搬送</option>
      <option value="No action required">措置不要</option>
      <option value="Turned over to civilian authorities">民間当局へ引き渡し</option>`;
  }

  function addAction() {
    const c = document.getElementById('actionsContainer');
    const row = document.createElement('div');
    row.className = 'action-row';
    row.innerHTML = `<select class="action-select">${actionOptions()}</select>
      <button type="button" class="btn-rm" onclick="this.parentElement.remove()">×</button>`;
    c.appendChild(row);
  }

  function pad2(n){ return String(n).padStart(2,'0'); }
  function v(id){ return (document.getElementById(id)?.value||'').trim(); }

  function formatDate(s) {
    if (!s) return 'UNKNOWN';
    const [y,m,d] = s.split('-');
    return `${pad2(d)}/${pad2(m)}/${y.slice(2)}`;
  }

  function generateReport() {
    const units      = v('units')      || '???';
    const dispatcher = v('dispatcher') || 'Fire Dispatch';
    const incType    = v('incidentTypeCustom') || v('incidentType') || 'INCIDENT';
    const building   = v('building');
    const timeStr    = v('incTime');
    const tz         = v('timezone') || 'JST';
    const dateStr    = v('incDate');
    const base       = v('base');
    const locDetail  = v('locationDetail');
    const arrCond    = v('arrivalCondition');
    const arrExtra   = v('arrivalExtra');
    const finding    = v('finding');
    const findDetail = v('findingDetail');
    const cause      = v('cause') || 'cause unknown';
    const actExtra   = v('actionsExtra');
    const outcome    = v('outcome') || 'returned to station';
    const freeNarr   = v('freeNarrative');

    const actions = [];
    document.querySelectorAll('.action-select').forEach(s => { if(s.value) actions.push(s.value); });

    const whereStr = [base, building].filter(Boolean).join(' ');
    const milTime  = timeStr ? timeStr.replace(':','') : '????';
    const whenStr  = `${milTime}(${tz}), ${formatDate(dateStr)}`;
    const unitList = units.split(',').map(u=>u.trim()).join(' and ');

    let narrative = '';
    if (freeNarr) {
      narrative = freeNarr;
    } else {
      const parts = [];
      parts.push(`${unitList} dispatched by ${dispatcher} for a ${incType} at ${whereStr || 'the reported location'}.`);

      if (arrCond) {
        let s = `Arrived on scene to find ${arrCond}`;
        if (arrExtra) s += `; ${arrExtra}`;
        parts.push(s + '.');
      }

      if (finding || findDetail) {
        let s = 'Upon investigation ';
        if (finding) { s += finding; if (findDetail) s += ` in ${findDetail}`; }
        else if (findDetail) s += `conditions found in ${findDetail}`;
        s += ` was found; ${cause}.`;
        parts.push(s);
      }

      if (actions.length === 1) {
        parts.push(`${actions[0]} and responding unit ${outcome}.`);
      } else if (actions.length > 1) {
        const last = actions[actions.length-1];
        parts.push(`${actions.slice(0,-1).join(', ')}, and ${last}.`);
        parts.push(`Responding unit ${outcome}.`);
      } else {
        parts.push(`Responding unit ${outcome}.`);
      }

      if (actExtra) parts.push(actExtra);
      narrative = parts.join(' ');
    }

    const report =
`5W
WHO:   ${units}
WHAT:  ${incType}
WHEN:  ${whenStr}
WHERE: ${whereStr || 'N/A'}
WHY:
${narrative}`;

    const box = document.getElementById('reportBox');
    box.textContent = report;
    box.dataset.report = report;
    const sec = document.getElementById('reportSection');
    sec.classList.add('visible');
    sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function copyReport() {
    const text = document.getElementById('reportBox').dataset.report || '';
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✅ Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function clearReport() {
    document.getElementById('reportSection').classList.remove('visible');
  }
</script>
</body>
</html>
