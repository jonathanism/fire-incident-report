<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fire Incident Report Generator</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f2f4f7; color: #1e2430; min-height: 100vh; font-size: 15px; }

    header {
      background: linear-gradient(135deg, #7b1010, #c0392b, #e67e22);
      padding: 16px 20px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.2);
    }
    header .icon { font-size: 1.8rem; }
    header h1 { font-size: 1.05rem; font-weight: 800; color: #fff; letter-spacing: .04em; }
    header p  { font-size: .72rem; color: rgba(255,255,255,.8); margin-top: 2px; }

    .wrapper { max-width: 820px; margin: 0 auto; padding: 20px 14px 50px; }

    .section-label {
      display: flex; align-items: center; gap: 9px; margin: 18px 0 8px;
    }
    .section-label .tag {
      background: #c0392b; color: #fff; font-size: .65rem; font-weight: 900;
      letter-spacing: .1em; padding: 3px 9px; border-radius: 4px;
    }
    .section-label .label-text { font-size: .75rem; color: #7a8599; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .section-label .line { flex: 1; height: 1px; background: #d5dae5; }

    .card { background: #fff; border: 1px solid #dde2ec; border-radius: 10px; padding: 18px 20px; margin-bottom: 6px; }

    .field { margin-bottom: 13px; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: .7rem; font-weight: 700; color: #8493ae; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
    .field label .ja { font-size: .8rem; color: #1e2430; font-weight: 600; text-transform: none; letter-spacing: 0; margin-left: 5px; }

    input[type="text"], input[type="date"], input[type="time"], select, textarea {
      width: 100%; background: #f7f9fc; border: 1.5px solid #d0d7e6;
      border-radius: 7px; padding: 9px 12px; color: #1e2430;
      font-size: .88rem; font-family: inherit; outline: none;
      transition: border-color .18s, box-shadow .18s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #c0392b; box-shadow: 0 0 0 3px rgba(192,57,43,.12); background: #fff;
    }
    textarea { resize: vertical; min-height: 68px; line-height: 1.6; }
    ::placeholder { color: #aab4c8; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    @media(max-width:480px){ .row2 { grid-template-columns: 1fr; } }

    .steps { display: flex; flex-direction: column; gap: 10px; }
    .step { display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; }
    .step-num {
      width: 32px; height: 32px; background: #c0392b; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .7rem; font-weight: 900; color: #fff; margin-top: 26px; flex-shrink: 0;
    }

    .btn-add-action {
      background: none; border: 1.5px dashed #c0d0e0; color: #8493ae;
      padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: .78rem;
      margin-top: 5px; transition: border-color .15s, color .15s;
    }
    .btn-add-action:hover { border-color: #c0392b; color: #c0392b; }
    .action-row { display: flex; gap: 8px; margin-bottom: 7px; }
    .action-row select { flex: 1; }
    .btn-rm { background: #fce8e6; border: none; color: #c0392b; border-radius: 6px; padding: 0 10px; cursor: pointer; font-size: 1rem; }

    .free-tag { background: #2980b9; }

    .autocomplete-wrap { position: relative; }
    .suggest-box {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 40; margin-top: 3px;
      background: #fff; border: 1.5px solid #d0d7e6; border-radius: 8px;
      max-height: 230px; overflow-y: auto; box-shadow: 0 10px 24px rgba(20,30,50,.14);
      display: none;
    }
    .suggest-box.open { display: block; }
    .suggest-item {
      padding: 10px 13px; font-size: .84rem; cursor: pointer; color: #1e2430;
      border-bottom: 1px solid #eef1f6; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .suggest-item:last-child { border-bottom: none; }
    .suggest-item:hover, .suggest-item.active { background: #fdecea; color: #922b21; }
    .suggest-item .freq { font-size: .66rem; color: #aab4c8; font-weight: 700; flex-shrink: 0; }
    .suggest-item:hover .freq, .suggest-item.active .freq { color: #c0392b; }

    .quick-types { margin-bottom: 9px; }
    .quick-row { display: flex; gap: 7px; margin-bottom: 7px; }
    .quick-row:last-child { margin-bottom: 0; }
    .chip {
      flex: 1; background: #f7f9fc; border: 1.5px solid #d0d7e6; color: #526074;
      padding: 10px 6px; border-radius: 8px; font-size: .76rem; font-weight: 800;
      cursor: pointer; text-align: center; transition: all .15s; letter-spacing: .01em;
    }
    .chip:hover { border-color: #e29a92; color: #c0392b; }
    .chip.active { background: #c0392b; border-color: #c0392b; color: #fff; box-shadow: 0 3px 10px rgba(192,57,43,.35); }

    #generateBtn {
      width: 100%; padding: 15px; margin-top: 20px;
      background: linear-gradient(135deg, #922b21, #c0392b);
      color: #fff; border: none; border-radius: 10px;
      font-size: .95rem; font-weight: 800; letter-spacing: .05em;
      cursor: pointer; box-shadow: 0 4px 16px rgba(192,57,43,.3);
      transition: transform .15s, box-shadow .15s; text-transform: uppercase;
    }
    #generateBtn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(192,57,43,.42); }
    #generateBtn:active { transform: none; }

    #reportSection { display: none; margin-top: 24px; }
    #reportSection.visible { display: block; }
    .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .report-title { font-size: .75rem; font-weight: 800; color: #c0392b; text-transform: uppercase; letter-spacing: .08em; }
    .toolbar-btns { display: flex; gap: 8px; }
    .btn-copy, .btn-clear {
      padding: 7px 15px; border-radius: 6px; font-size: .78rem; font-weight: 700; cursor: pointer; border: none;
    }
    .btn-copy { background: #27ae60; color: #fff; }
    .btn-copy:hover { background: #1e9149; }
    .btn-copy.copied { background: #145a32; }
    .btn-clear { background: #e8ecf3; color: #7a8599; }
    .btn-clear:hover { background: #d0d7e6; }

    #reportBox {
      background: #111827; border: 1px solid #1e293b; border-radius: 10px;
      padding: 20px 24px; font-family: 'Courier New', monospace;
      font-size: .85rem; line-height: 1.9; white-space: pre-wrap;
      word-break: break-word; color: #c9d8f0;
    }

    .req { color: #c0392b; }
    footer { text-align: center; font-size: .68rem; color: #aab4c8; padding: 20px; }
  </style>
</head>
<body>

<header>
  <div class="icon">🚒</div>
  <div>
    <h1>FIRE INCIDENT REPORT GENERATOR</h1>
    <p>日本語で入力 → 英文 5W インシデントレポートを自動生成</p>
  </div>
</header>

<div class="wrapper">

  <!-- WHO -->
  <div class="section-label">
    <span class="tag">WHO</span>
    <span class="label-text">対応部隊</span>
    <span class="line"></span>
  </div>
  <div class="card">
    <div class="field autocomplete-wrap">
      <label>出動部隊 <span class="ja">Responding Units</span> <span class="req">*</span></label>
      <input type="text" id="units" placeholder="例: E-11, L-1" autocomplete="off"/>
      <div class="suggest-box" id="unitsSuggest"></div>
    </div>
    <div class="field autocomplete-wrap">
      <label>指令センター <span class="ja">Dispatched by</span></label>
      <input type="text" id="dispatcher" placeholder="例: Butler Fire" autocomplete="off"/>
      <div class="suggest-box" id="dispatcherSuggest"></div>
    </div>
  </div>

  <!-- WHAT -->
  <div class="section-label">
    <span class="tag">WHAT</span>
    <span class="label-text">インシデント種別</span>
    <span class="line"></span>
  </div>
  <div class="card">
    <div class="row2">
      <div class="field">
        <label>種別 <span class="ja">Incident Type</span> <span class="req">*</span></label>
        <div class="quick-types">
          <div class="quick-row">
            <button type="button" class="chip" data-type="FIRE ALARM">Fire Alarm</button>
            <button type="button" class="chip" data-type="TROUBLE ALARM">Trouble Alarm</button>
            <button type="button" class="chip" data-type="SUPERVISORY ALARM">Supervisory Alarm</button>
          </div>
          <div class="quick-row">
            <button type="button" class="chip" data-type="MEDICAL CALL">Medical</button>
            <button type="button" class="chip" data-type="FIRE">Fire</button>
          </div>
        </div>
        <select id="incidentType">
          <option value="">選択...</option>
          <optgroup label="火災">
            <option value="FIRE">火災（種別未確定） / Fire</option>
            <option value="STRUCTURE FIRE">建物火災</option>
            <option value="VEHICLE FIRE">車両火災</option>
            <option value="WILDLAND FIRE">山林火災</option>
            <option value="ELECTRICAL FIRE">電気火災</option>
          </optgroup>
          <optgroup label="警報・調査">
            <option value="FIRE ALARM">火災報知器 / Fire Alarm</option>
            <option value="TROUBLE ALARM">トラブルアラーム / Trouble Alarm</option>
            <option value="SUPERVISORY ALARM">監視警報 / Supervisory Alarm</option>
            <option value="SMOKE INVESTIGATION">煙調査</option>
            <option value="CARBON MONOXIDE ALARM">CO警報</option>
            <option value="FALSE ALARM">誤報</option>
          </optgroup>
          <optgroup label="救急・その他">
            <option value="MEDICAL CALL">医療緊急 / Medical Call</option>
            <option value="HAZMAT INCIDENT">危険物</option>
            <option value="GAS LEAK">ガス漏れ</option>
            <option value="VEHICLE ACCIDENT">交通事故</option>
            <option value="MUTUAL AID">相互援助</option>
          </optgroup>
        </select>
      </div>
      <div class="field">
        <label>カスタム <span class="ja">Custom Type（任意）</span></label>
        <input type="text" id="incidentTypeCustom" placeholder="上記以外の場合"/>
      </div>
    </div>
  </div>

  <!-- WHEN -->
  <div class="section-label">
    <span class="tag">WHEN</span>
    <span class="label-text">日時</span>
    <span class="line"></span>
  </div>
  <div class="card">
    <div class="row2">
      <div class="field">
        <label>時刻 <span class="ja">Time</span></label>
        <input type="time" id="incTime"/>
      </div>
      <div class="field">
        <label>タイムゾーン <span class="ja">Timezone</span></label>
        <select id="timezone">
          <option value="JST">JST</option>
          <option value="LOCAL">LOCAL</option>
          <option value="ZULU">ZULU</option>
          <option value="EST">EST</option>
          <option value="PST">PST</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>日付 <span class="ja">Date</span></label>
      <input type="date" id="incDate"/>
    </div>
  </div>

  <!-- WHERE -->
  <div class="section-label">
    <span class="tag">WHERE</span>
    <span class="label-text">場所</span>
    <span class="line"></span>
  </div>
  <div class="card">
    <div class="field autocomplete-wrap">
      <label>基地・施設名 <span class="ja">Installation / Base</span></label>
      <input type="text" id="base" placeholder="例: CAMP FOSTER" autocomplete="off"/>
      <div class="suggest-box" id="baseSuggest"></div>
    </div>
    <div class="field autocomplete-wrap">
      <label>詳細場所 <span class="ja">Specific Location</span></label>
      <input type="text" id="locationDetail" placeholder="例: Room#302, 2nd Floor" autocomplete="off"/>
      <div class="suggest-box" id="locationDetailSuggest"></div>
    </div>
  </div>

  <!-- WHY -->
  <div class="section-label">
    <span class="tag">WHY</span>
    <span class="label-text">経緯・ナラティブ</span>
    <span class="line"></span>
  </div>
  <div class="card">
    <div class="steps" id="fireFlow">

      <div class="step">
        <div class="step-num">1</div>
        <div class="step-body">
          <div class="field">
            <label>到着時の状況 <span class="ja">Arrival / Scene Conditions</span></label>
            <select id="arrivalCondition">
              <option value="">選択...</option>
              <option value="nothing showing outside on 360 survey">外観異常なし（360度確認）</option>
              <option value="smoke showing from the structure">建物から煙が見える</option>
              <option value="flames showing from the structure">建物から炎が見える</option>
              <option value="heavy smoke conditions throughout the building">建物全体に濃煙</option>
              <option value="fire fully involved">全焼状態</option>
              <option value="scene clear upon arrival">到着時異常なし</option>
              <option value="vehicle fully involved in flames">車両が全焼</option>
              <option value="patients on scene requiring medical attention">要救護者あり</option>
            </select>
          </div>
          <div class="field">
            <label>補足 <span class="ja">Additional notes（任意）</span></label>
            <input type="text" id="arrivalExtra" placeholder="例: bystanders reported smoke on 3rd floor"/>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-num">2</div>
        <div class="step-body">
          <div class="field">
            <label>調査結果 <span class="ja">Investigation Finding</span></label>
            <select id="finding">
              <option value="">選択...</option>
              <option value="smoke detector activation">煙感知器の作動</option>
              <option value="heat detector activation">熱感知器の作動</option>
              <option value="sprinkler activation">スプリンクラーの作動</option>
              <option value="burnt food/cooking odor, no fire">焦げ臭・調理臭（火災なし）</option>
              <option value="extinguished fire prior to arrival">到着前に鎮火済み</option>
              <option value="active fire on the floor">現場に活火</option>
              <option value="no evidence of fire or smoke">煙・火災の痕跡なし</option>
              <option value="gas leak detected">ガス漏れ検知</option>
              <option value="CO levels elevated">CO濃度上昇</option>
              <option value="faulty alarm/system malfunction">警報機の誤作動・故障</option>
            </select>
          </div>
          <div class="field">
            <label>場所・詳細 <span class="ja">Location / Detail</span></label>
            <input type="text" id="findingDetail" placeholder="例: room#302, kitchen area"/>
          </div>
          <div class="field">
            <label>原因 <span class="ja">Cause</span></label>
            <select id="cause">
              <option value="cause unknown">原因不明</option>
              <option value="under investigation">調査中</option>
              <option value="accidental">偶発的（事故）</option>
              <option value="unattended cooking">調理放置</option>
              <option value="electrical malfunction">電気系統の故障</option>
              <option value="suspected arson">放火疑い</option>
              <option value="equipment malfunction">設備故障</option>
              <option value="candle/open flame">ろうそく・裸火</option>
              <option value="malicious activation">いたずら / Malicious</option>
              <option value="no fire present — system fault">火災なし・システム誤作動</option>
            </select>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-num">3</div>
        <div class="step-body">
          <div class="field">
            <label>実施した措置 <span class="ja">Actions Taken</span> <span class="req">*</span></label>
            <div id="actionsContainer">
              <div class="action-row">
                <select class="action-select">
                  <option value="">選択...</option>
                  <option value="System reset completed">システムリセット完了</option>
                  <option value="Fire suppressed using 1¾-inch hose line">1¾インチホースで鎮火</option>
                  <option value="Ventilation conducted">換気実施</option>
                  <option value="Building evacuated">建物避難完了</option>
                  <option value="Utilities isolated (gas/electric)">ガス・電気遮断</option>
                  <option value="CO levels cleared">CO濃度正常確認</option>
                  <option value="Area ventilated and monitored">エリア換気・監視</option>
                  <option value="Overhaul conducted">オーバーホール実施</option>
                  <option value="Patient treated and transported">傷病者処置・搬送</option>
                  <option value="No action required">措置不要</option>
                  <option value="Turned over to civilian authorities">民間当局へ引き渡し</option>
                  <option value="Maintenance request submitted">メンテナンス要請</option>
                </select>
              </div>
            </div>
            <button type="button" class="btn-add-action" onclick="addAction()">＋ 措置を追加</button>
          </div>
          <div class="field">
            <label>補足・備考 <span class="ja">Additional Notes</span></label>
            <textarea id="actionsExtra" rows="2" placeholder="例: No injuries reported. Facility manager notified."></textarea>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-num">4</div>
        <div class="step-body">
          <div class="field">
            <label>結末 <span class="ja">Outcome / Resolution</span></label>
            <select id="outcome">
              <option value="returned to station">部隊帰還</option>
              <option value="remained on scene for overhaul">オーバーホールのため現場残留</option>
              <option value="turned over to civilian fire department">民間消防へ引き渡し</option>
              <option value="patient transported to naval hospital">傷病者を海軍病院へ搬送</option>
              <option value="scene secured and handed over to MP">MPへ引き渡し</option>
            </select>
          </div>
        </div>
      </div>

    </div>

    <div class="steps" id="medicalFlow" style="display:none;">

      <div class="step">
        <div class="step-num">A</div>
        <div class="step-body">
          <div class="field">
            <label>年齢・性別 <span class="ja">Age / Gender</span></label>
            <div class="row2">
              <input type="text" id="medAge" placeholder="例: 58"/>
              <select id="medGender">
                <option value="">選択...</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>現場到着時の状況 <span class="ja">Arrived on scene to find</span></label>
            <input type="text" id="medArrived" placeholder="例: lying in bed / seated in chair, alert and oriented x4"/>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-num">C</div>
        <div class="step-body">
          <div class="field">
            <label>主訴 <span class="ja">Chief complaint of</span></label>
            <input type="text" id="medChief" placeholder="例: chest pain, onset 30 min prior"/>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-num">H</div>
        <div class="step-body">
          <div class="field">
            <label>経過 <span class="ja">History (What happened)</span></label>
            <textarea id="medHistory" rows="2" placeholder="例: Patient states symptoms began while at work, no known trauma."></textarea>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-num">A</div>
        <div class="step-body">
          <div class="field">
            <label>観察所見 <span class="ja">Assessment findings</span></label>
            <div class="quick-row">
              <button type="button" class="chip" data-fill="medAssessment" data-value="alert and oriented x4, ABCs intact">意識清明・ABC異常なし</button>
            </div>
            <textarea id="medAssessment" rows="2" placeholder="例: Vitals BP 128/82, HR 96, RR 18, SpO2 98% RA. Lungs clear bilaterally."></textarea>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-num">R</div>
        <div class="step-body">
          <div class="field">
            <label>処置 <span class="ja">Treatment rendered</span></label>
            <div class="quick-row">
              <button type="button" class="chip" data-fill="medTreatment" data-value="Crew assisted EMT with patient assessment and loaded patient to the ambulance">観察・処置介助し救急車収容</button>
            </div>
            <textarea id="medTreatment" rows="2" placeholder="例: Oxygen administered via NC at 4LPM, patient placed on monitor."></textarea>
          </div>
        </div>
      </div>

      <div class="step">
        <div class="step-num">T</div>
        <div class="step-body">
          <div class="field autocomplete-wrap">
            <label>搬送先 <span class="ja">Transported to</span></label>
            <input type="text" id="medTransport" placeholder="例: US Naval Hospital Okinawa" autocomplete="off"/>
            <div class="suggest-box" id="medTransportSuggest"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- FREE -->
  <div class="section-label" style="margin-top:18px;">
    <span class="tag free-tag">FREE</span>
    <span class="label-text">フリーナラティブ（任意上書き）</span>
    <span class="line"></span>
  </div>
  <div class="card">
    <div class="field">
      <label>WHYを自由記述で上書き <span class="ja">Override narrative</span></label>
      <textarea id="freeNarrative" rows="4" placeholder="ここに英語で直接入力するとWHY部分をそのまま使用します（空欄の場合は上のステップから自動生成）"></textarea>
    </div>
  </div>

  <button id="generateBtn" onclick="generateReport()">🔥 GENERATE INCIDENT REPORT</button>

  <!-- Output -->
  <div id="reportSection">
    <div class="report-header">
      <span class="report-title">⚡ Generated Report</span>
      <div class="toolbar-btns">
        <button class="btn-copy" id="copyBtn" onclick="copyReport()">📋 Copy</button>
        <button class="btn-clear" onclick="clearReport()">✕ Clear</button>
      </div>
    </div>
    <div id="reportBox"></div>
  </div>

</div>

<footer>Fire Incident Report Generator — For training / drill use only</footer>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const now = new Date();
    document.getElementById('incDate').valueAsDate = now;
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('incTime').value = `${h}:${m}`;

    setupAutocomplete('units', 'unitsSuggest', 'units', { multi: true });
    setupAutocomplete('dispatcher', 'dispatcherSuggest', 'dispatcher', { multi: false });
    setupAutocomplete('base', 'baseSuggest', 'base', { multi: false });
    setupAutocomplete('locationDetail', 'locationDetailSuggest', 'location', { multi: false });
    setupAutocomplete('medTransport', 'medTransportSuggest', 'transport', { multi: false });
    setupQuickTypeChips();
    setupQuickFillChips();
  });

  // ---- Frequency-based suggestions (learned per-browser via localStorage) ----
  const SUGGEST_KEY = 'fireReportSuggestions';

  // Shown by default before any usage history exists, so common values predict immediately.
  function defaultSuggestionData() {
    return {
      units: { 'E-11': 1, 'L-1': 1 },
      dispatcher: { 'Butler Fire': 1 },
      base: { 'Camp Foster': 1 },
      location: { 'Bldg#': 1, 'Room#': 1 },
      transport: { 'USNH Okinawa': 1 }
    };
  }

  function loadSuggestionData() {
    const defaults = defaultSuggestionData();
    try {
      const raw = localStorage.getItem(SUGGEST_KEY);
      if (!raw) return defaults;
      const data = JSON.parse(raw) || {};
      const pick = (cat) => (data[cat] && Object.keys(data[cat]).length) ? data[cat] : defaults[cat];
      return { units: pick('units'), dispatcher: pick('dispatcher'), base: pick('base'), location: pick('location'), transport: pick('transport') };
    } catch (e) { return defaults; }
  }
  function saveSuggestionData() {
    try { localStorage.setItem(SUGGEST_KEY, JSON.stringify(suggestionData)); } catch (e) {}
  }
  let suggestionData = loadSuggestionData();
  saveSuggestionData();

  function recordUsage(category, value) {
    if (!value) return;
    suggestionData[category][value] = (suggestionData[category][value] || 0) + 1;
    saveSuggestionData();
  }

  function getSuggestions(category, query) {
    const q = (query || '').toLowerCase();
    return Object.entries(suggestionData[category] || {})
      .filter(([val]) => val.toLowerCase().includes(q))
      .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
      .slice(0, 8);
  }

  function setupAutocomplete(inputId, boxId, category, opts) {
    const input = document.getElementById(inputId);
    const box = document.getElementById(boxId);
    const multi = !!(opts && opts.multi);

    function currentToken() {
      if (!multi) return input.value;
      const parts = input.value.split(',');
      return parts[parts.length - 1].trim();
    }

    function render() {
      const list = getSuggestions(category, currentToken());
      if (!list.length) { box.classList.remove('open'); box.innerHTML = ''; return; }
      box.innerHTML = list.map(([val, freq]) =>
        `<div class="suggest-item" data-val="${val.replace(/"/g,'&quot;')}"><span>${val}</span><span class="freq">${freq}回</span></div>`
      ).join('');
      box.classList.add('open');
    }

    function choose(val) {
      if (multi) {
        const parts = input.value.split(',').map(p => p.trim()).filter((p, i, arr) => !(i === arr.length - 1 && p === ''));
        parts.pop();
        parts.push(val);
        input.value = parts.join(', ') + ', ';
      } else {
        input.value = val;
      }
      box.classList.remove('open');
      input.focus();
    }

    input.addEventListener('focus', render);
    input.addEventListener('input', render);
    input.addEventListener('blur', () => setTimeout(() => box.classList.remove('open'), 150));
    box.addEventListener('mousedown', (e) => {
      const item = e.target.closest('.suggest-item');
      if (item) { e.preventDefault(); choose(item.dataset.val); }
      else { box.classList.remove('open'); }
    });
  }

  // ---- Incident Type quick-select chips ----
  function setupQuickTypeChips() {
    const select = document.getElementById('incidentType');
    const custom = document.getElementById('incidentTypeCustom');
    const chips = document.querySelectorAll('.chip[data-type]');

    function clearActive() { chips.forEach(b => b.classList.remove('active')); }

    chips.forEach(btn => {
      btn.addEventListener('click', () => {
        clearActive();
        btn.classList.add('active');
        const val = btn.dataset.type;
        const hasOption = Array.from(select.options).some(o => o.value === val);
        if (hasOption) { select.value = val; custom.value = ''; }
        else { select.value = ''; custom.value = val; }
        updateFlowVisibility();
      });
    });
    select.addEventListener('change', () => { clearActive(); updateFlowVisibility(); });
    custom.addEventListener('input', () => { clearActive(); updateFlowVisibility(); });
    updateFlowVisibility();
  }

  // Medical Emergency incidents use the ACHART narrative flow instead of the fire-incident steps.
  function isMedicalIncident() {
    const val = (v('incidentTypeCustom') || v('incidentType') || '').toUpperCase();
    return val.includes('MEDICAL');
  }
  function updateFlowVisibility() {
    const medical = isMedicalIncident();
    document.getElementById('fireFlow').style.display = medical ? 'none' : '';
    document.getElementById('medicalFlow').style.display = medical ? '' : 'none';
  }

  // One-click insert of common, pre-vetted English phrasing (e.g. Assessment/Treatment boilerplate)
  // so common entries don't depend on machine-translation quality.
  function setupQuickFillChips() {
    document.querySelectorAll('.chip[data-fill]').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.fill);
        if (target) target.value = btn.dataset.value;
      });
    });
  }

  function actionOptions() {
    return `<option value="">選択...</option>
      <option value="System reset completed">システムリセット完了</option>
      <option value="Fire suppressed using 1¾-inch hose line">1¾インチホースで鎮火</option>
      <option value="Ventilation conducted">換気実施</option>
      <option value="Building evacuated">建物避難完了</option>
      <option value="Utilities isolated (gas/electric)">ガス・電気遮断</option>
      <option value="CO levels cleared">CO濃度正常確認</option>
      <option value="Area ventilated and monitored">エリア換気・監視</option>
      <option value="Overhaul conducted">オーバーホール実施</option>
      <option value="Patient treated and transported">傷病者処置・搬送</option>
      <option value="No action required">措置不要</option>
      <option value="Turned over to civilian authorities">民間当局へ引き渡し</option>
      <option value="Maintenance request submitted">メンテナンス要請</option>`;
  }

  function addAction() {
    const c = document.getElementById('actionsContainer');
    const row = document.createElement('div');
    row.className = 'action-row';
    row.innerHTML = `<select class="action-select">${actionOptions()}</select>
      <button type="button" class="btn-rm" onclick="this.parentElement.remove()">×</button>`;
    c.appendChild(row);
  }

  function pad2(n){ return String(n).padStart(2,'0'); }
  function v(id){ return (document.getElementById(id)?.value||'').trim(); }

  function formatDate(s) {
    if (!s) return 'UNKNOWN';
    const [y,m,d] = s.split('-');
    return `${pad2(d)}/${pad2(m)}/${y.slice(2)}`;
  }

  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function lowerFirst(s) { return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; }
  function endSentence(s) { if (!s) return s; const t = s.trim(); return /[.!?]$/.test(t) ? t : t + '.'; }
  // "FIRE ALARM" -> "Fire alarm" (first letter capitalized, rest lowercased — not per-word title case)
  function sentenceCase(s) { return s ? cap(s.toLowerCase()) : s; }
  // ['E-11'] -> "E-11"; ['E-11','L-1'] -> "E-11 and L-1"; ['E-11','Med-1','Sqd-1'] -> "E-11, Med-1 and Sqd-1"
  function joinList(arr) {
    if (arr.length === 0) return '';
    if (arr.length === 1) return arr[0];
    if (arr.length === 2) return `${arr[0]} and ${arr[1]}`;
    return `${arr.slice(0, -1).join(', ')} and ${arr[arr.length - 1]}`;
  }

  // ---- Best-effort JA -> EN machine translation for free-text medical narrative fields ----
  // Uses the free, keyless MyMemory API. Not guaranteed accurate — review before official use.
  const JP_REGEX = /[぀-ヿ㐀-䶿一-鿿ｦ-ﾟ]/;

  async function translateToEnglish(text) {
    if (!text || !JP_REGEX.test(text)) return text;
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ja|en`);
      if (!res.ok) return text;
      const data = await res.json();
      const translated = data && data.responseData && data.responseData.translatedText;
      return translated ? translated : text;
    } catch (e) {
      return text;
    }
  }

  async function generateReport() {
    const units      = v('units')      || '???';
    const dispatcher = v('dispatcher') || 'Fire Dispatch';
    const incType    = v('incidentTypeCustom') || v('incidentType') || 'INCIDENT';
    const timeStr    = v('incTime');
    const tz         = v('timezone') || 'JST';
    const dateStr    = v('incDate');
    const base       = v('base');
    const locDetail  = v('locationDetail');
    const arrCond    = v('arrivalCondition');
    const arrExtra   = v('arrivalExtra');
    const finding    = v('finding');
    const findDetail = v('findingDetail');
    const cause      = v('cause') || 'cause unknown';
    const actExtra   = v('actionsExtra');
    const outcome    = v('outcome') || 'returned to station';
    const freeNarr   = v('freeNarrative');
    const medical    = isMedicalIncident();
    const medAge      = v('medAge');
    const medGender   = v('medGender');
    let medArrived    = v('medArrived');
    let medChief       = v('medChief');
    let medHistory     = v('medHistory');
    let medAssessment  = v('medAssessment');
    let medTreatment   = v('medTreatment');
    let medTransport   = v('medTransport');

    const actions = [];
    document.querySelectorAll('.action-select').forEach(s => { if(s.value) actions.push(s.value); });

    v('units').split(',').map(u=>u.trim()).filter(Boolean).forEach(u => recordUsage('units', u));
    const rawDispatcher = v('dispatcher');
    if (rawDispatcher) recordUsage('dispatcher', rawDispatcher);
    if (base) recordUsage('base', base);
    if (locDetail) recordUsage('location', locDetail);
    if (medTransport) recordUsage('transport', medTransport);

    const whereStr = [base, locDetail].filter(Boolean).join(' ');
    const milTime  = timeStr ? timeStr.replace(':','') : '????';
    const whenStr  = `${milTime}(${tz}), ${formatDate(dateStr)}`;
    const unitTokens   = units.split(',').map(u=>u.trim()).filter(Boolean);
    const unitsDisplay = unitTokens.length ? unitTokens.join(', ') : units;
    const unitList      = unitTokens.length ? joinList(unitTokens) : units;
    const incTypeDisplay = sentenceCase(incType);

    const btn = document.getElementById('generateBtn');
    const btnOriginalText = btn.textContent;
    if (medical && !freeNarr) {
      btn.disabled = true;
      btn.textContent = '🌐 翻訳中 / Translating...';
      try {
        [medArrived, medChief, medHistory, medAssessment, medTreatment, medTransport] = await Promise.all(
          [medArrived, medChief, medHistory, medAssessment, medTreatment, medTransport].map(translateToEnglish)
        );
      } finally {
        btn.disabled = false;
        btn.textContent = btnOriginalText;
      }
    }

    let narrative = '';
    if (freeNarr) {
      narrative = freeNarr;
    } else if (medical) {
      // ACHART flow: Arrived + Chief complaint combined into one opening line,
      // then History / Assessment / Rx (treatment) / Transported each on their own line.
      const medWhereStr = (base && locDetail) ? `${locDetail} on ${base}` : whereStr;
      const intro = `${unitList} dispatched by ${dispatcher} for a ${incTypeDisplay} at ${medWhereStr || 'the reported location'}.`;

      const ageGenderBits = [];
      if (medAge)    ageGenderBits.push(`${medAge}-year-old`);
      if (medGender) ageGenderBits.push(medGender);
      const ageGenderStr = ageGenderBits.join(' ');
      const arrivedDesc = [ageGenderStr, medArrived].filter(Boolean).join(' ');

      const openBits = [];
      if (arrivedDesc) openBits.push(`arrived on scene to find ${arrivedDesc}`);
      if (medChief)    openBits.push(`c/c of ${medChief}`);
      const s1 = openBits.length ? endSentence(cap(openBits.join(', '))) : '';

      const s2 = medHistory ? endSentence(`Patient ${lowerFirst(medHistory)}`) : '';
      const s3 = medAssessment ? endSentence(`Patient was ${medAssessment}`) : '';
      const s4 = medTreatment ? endSentence(cap(medTreatment)) : '';
      const s5 = medTransport ? `Patient was transported to ${medTransport}.` : '';

      narrative = [intro, s1, s2, s3, s4, s5].filter(Boolean).join('\n');
    } else {
      const parts = [];
      parts.push(`${unitList} dispatched by ${dispatcher} for a ${incTypeDisplay} at ${whereStr || 'the reported location'}.`);

      if (arrCond) {
        let s = `Arrived on scene to find ${arrCond}`;
        if (arrExtra) s += `; ${arrExtra}`;
        parts.push(s + '.');
      }

      if (finding || findDetail) {
        let s = 'Upon investigation ';
        if (finding) { s += finding; if (findDetail) s += ` in ${findDetail}`; }
        else if (findDetail) s += `conditions found in ${findDetail}`;
        s += ` was found; ${cause}.`;
        parts.push(s);
      }

      if (actions.length === 1) {
        parts.push(`${actions[0]} and responding unit ${outcome}.`);
      } else if (actions.length > 1) {
        const last = actions[actions.length-1];
        parts.push(`${actions.slice(0,-1).join(', ')}, and ${last}.`);
        parts.push(`Responding unit ${outcome}.`);
      } else {
        parts.push(`Responding unit ${outcome}.`);
      }

      if (actExtra) parts.push(actExtra);
      narrative = parts.join('\n');
    }

    const report =
`5W
WHO:   ${unitsDisplay}
WHAT:  ${incTypeDisplay}
WHEN:  ${whenStr}
WHERE: ${whereStr || 'N/A'}
WHY:
${narrative}`;

    const box = document.getElementById('reportBox');
    box.textContent = report;
    box.dataset.report = report;
    const sec = document.getElementById('reportSection');
    sec.classList.add('visible');
    sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function copyReport() {
    const text = document.getElementById('reportBox').dataset.report || '';
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✅ Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2000);
    });
  }

  function clearReport() {
    document.getElementById('reportSection').classList.remove('visible');
  }
</script>
